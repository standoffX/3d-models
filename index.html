<script>
const $=id=>document.getElementById(id);
const DEMO_DATA={
 user:{id:"100001",nickname:"SofterX",gold:2450,coins:160,avatar:""},
 friends:[
  {id:"100204",nickname:"NEON",status:"В сети",online:true,fbx:"Talking On Phone.fbx",color:0x2c95a8},

  {id:"100488",nickname:"v0id",status:"Не в сети",online:false,fbx:"Talking On Phone.fbx",color:0x8c9baf},
  {id:"100529",nickname:"Frost",status:"В матче",online:false,fbx:"Illegal Elbow Punch.fbx",color:0x8fc7a8}
 ],
 modes:[
  {id:"kb",name:"КБ",icon:"⚔",description:"Рейтинговый матч и раунды.",tag:"COMPETITIVE"},
  {id:"allies",name:"Союзники",icon:"◈",description:"Быстрый командный режим.",tag:"ALLIES"},

 ],

};
try{const saved=JSON.parse(localStorage.getItem("sx-menu-profile")||"null");if(saved&&typeof saved==="object")Object.assign(DEMO_DATA.user,saved)}catch{}
const state={
 view:"home",mode:"kb",map:"Sandstone",enemy:"players",friendFilter:"all",search:"",
 members:[],invited:new Set(),joined:new Set(),
 theme:localStorage.getItem("sx-theme")||"cyan",language:localStorage.getItem("sx-language")||"ru",
 animation:localStorage.getItem("sx-animation")!=="false",low:localStorage.getItem("sx-low-effects")==="true",
 reduced:localStorage.getItem("sx-reduce-motion")==="true",sensitivity:Number(localStorage.getItem("sx-sensitivity")||5)
};
window.STANDOFFX_MENU={state:state,user:DEMO_DATA.user,friends:DEMO_DATA.friends};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatarHtml(person,cls){const className=cls||"";if(person.avatar)return '<div class="avatar '+className+'"><img alt="" src="'+esc(person.avatar)+'"></div>';return '<div class="avatar '+className+'">'+esc((person.nickname||"?").slice(0,1).toUpperCase())+'</div>'}
function toast(title,message){const n=document.createElement("div");n.className="toast";n.innerHTML="<b>"+esc(title)+"</b> "+esc(message);$("toastHost").appendChild(n);setTimeout(()=>n.remove(),2800)}
function persistProfile(){try{localStorage.setItem("sx-menu-profile",JSON.stringify(DEMO_DATA.user))}catch{toast("Аватар","Изображение слишком большое для локального хранилища.")}}
function persistSettings(){localStorage.setItem("sx-theme",state.theme);localStorage.setItem("sx-language",state.language);localStorage.setItem("sx-animation",String(state.animation));localStorage.setItem("sx-low-effects",String(state.low));localStorage.setItem("sx-reduce-motion",String(state.reduced));localStorage.setItem("sx-sensitivity",String(state.sensitivity));document.documentElement.classList.toggle("theme-violet",state.theme==="violet");document.documentElement.classList.toggle("theme-orange",state.theme==="orange");document.body.classList.toggle("low-effects",state.low);if(window.__menuSetQuality)window.__menuSetQuality(state.low);if(window.__menuSetMotion)window.__menuSetMotion(state.animation);paintUser()}
function paintUser(){const u=DEMO_DATA.user;["topAvatar","miniAvatar"].forEach(id=>{const n=$(id);n.innerHTML=u.avatar?'<img alt="" src="'+esc(u.avatar)+'">':esc(u.nickname.slice(0,1).toUpperCase())});$("topNick").textContent=u.nickname;$("topId").textContent="ID "+u.id;$("goldValue").textContent=Number(u.gold||0).toLocaleString("ru-RU");$("coinValue").textContent=Number(u.coins||0).toLocaleString("ru-RU");$("stageAgentName").textContent=u.nickname.toUpperCase();$("miniSquadLabel").textContent="Твоя группа · "+(state.mode==="training"?1:state.members.length+1)+"/4"}
function visibleMembers(){return state.mode==="training"?[]:state.members}
function cap(){return state.mode==="training"?1:4}
function renderFriends(){
 const query=state.search.toLowerCase();
 const list=DEMO_DATA.friends.filter(f=>{
  const match=(f.nickname+" "+f.id).toLowerCase().includes(query);
  const visible=state.friendFilter==="all"||(state.friendFilter==="online"&&f.online)||(state.friendFilter==="invited"&&state.joined.has(f.id));
  return match&&visible;
 });
 $("friendsCount").textContent=DEMO_DATA.friends.filter(f=>f.online).length+" В СЕТИ";
 $("onlineCount").textContent=DEMO_DATA.friends.filter(f=>f.online).length+" онлайн";
 $("friendsList").innerHTML=list.map(f=>{
  const joined=state.joined.has(f.id),pending=state.invited.has(f.id)&&!joined;
  const button=joined?'<button class="invite-btn joined" disabled title="Уже в лобби">✓</button>':pending?'<button class="invite-btn pending" disabled title="Ожидание">···</button>':f.online?'<button class="invite-btn" data-invite="'+esc(f.id)+'" title="Пригласить в лобби">＋</button>':'<button class="invite-btn" disabled title="Игрок недоступен">−</button>';
  const status=joined?"В лобби":pending?"Приглашение отправлено":f.status;
  return '<div class="friend">'+avatarHtml(f)+'<div class="friend-info"><b>'+esc(f.nickname)+'</b><small><i class="presence '+(f.online?"online":"")+'"></i>'+esc(status)+'</small></div>'+button+'</div>';
 }).join("")||'<div class="friend-empty">Ничего не найдено</div>';
 $("friendsList").querySelectorAll("[data-invite]").forEach(b=>b.addEventListener("click",()=>inviteFriend(b.dataset.invite)));
}
function inviteFriend(id){
 if(state.mode==="training"){toast("Тренировка","В этом режиме ты играешь один.");return}
 const friend=DEMO_DATA.friends.find(f=>f.id===id);
 if(!friend||!friend.online||state.invited.has(id)||state.joined.has(id))return;
 if(state.members.length>=3){toast("Команда заполнена","В лобби помещается до четырёх игроков.");return}
 state.invited.add(id);renderFriends();renderRightPanel();
 toast("Приглашение отправлено","Ожидаем "+friend.nickname+".");
 /* Local demo of accepting an invite. Replace with the server's lobby_join event later. */
 setTimeout(()=>{
  if(state.mode==="training"||state.joined.has(id))return;
  if(state.members.length>=3){state.invited.delete(id);renderFriends();renderRightPanel();return}
  state.joined.add(id);state.invited.delete(id);
  state.members.push({id:friend.id,nickname:friend.nickname,avatar:"",fbx:friend.fbx,color:friend.color});
  friend.status="В лобби";
  renderFriends();renderRightPanel();updateSceneLabels();
  if(window.__syncTeamActors)window.__syncTeamActors();
  toast(friend.nickname,"Присоединился к лобби.");
 },1300);
}
function renderTeamRows(){
 const people=[{...DEMO_DATA.user,host:true},...visibleMembers()];
 if(!people.length)return '<div class="friend-empty">Команда пока пуста</div>';
 return people.map(p=>'<div class="team-row">'+avatarHtml(p)+'<b>'+esc(p.nickname)+'</b><small class="'+(p.host?"host":"")+'">'+(p.host?"Лидер":"В лобби")+'</small></div>').join("");
}
function renderHomePanel(){
 return '<section class="card"><div class="card-head"><h2>ПРОФИЛЬ ИГРОКА</h2><button class="text-link" data-open-view="profile">Профиль ↗</button></div><div class="profile-card-row">'+avatarHtml(DEMO_DATA.user)+'<div><b>'+esc(DEMO_DATA.user.nickname)+'</b><small>ID '+esc(DEMO_DATA.user.id)+'</small></div></div><div class="rank-row"><div class="rank-emblem">✧</div><div class="rank-copy"><b>Серебро III</b><small>Уровень 18 · 1 260 / 2 000 XP</small><div class="xp"><span></span></div></div></div></section>'+
 '<section class="card"><div class="card-head"><h2>ТВОЯ КОМАНДА</h2><button class="text-link" data-open-view="lobby">'+(visibleMembers().length+1)+' / '+cap()+' ↗</button></div><div class="team-list">'+renderTeamRows()+'</div><button class="secondary-btn" style="width:100%;margin-top:12px" data-open-view="lobby">Открыть лобби →</button></section>'+
 '<section class="right-event"><div class="event-tag">НОВАЯ КОЛЛЕКЦИЯ</div><strong>FIRST LIGHT</strong><small>Посмотреть коллекцию и предметы</small></section>'+
 '<section class="card"><div class="card-head"><h2>СОБЫТИЯ</h2><span style="font-size:9px;color:var(--muted)">СЕЗОН</span></div><div style="font-size:11px;font-weight:900">Новые задания доступны</div><div style="font-size:9px;color:var(--muted);margin-top:5px;line-height:1.5">События и награды появятся здесь после подключения данных.</div></section>';
}

 return '<div class="eyebrow">ВЫБОР РЕЖИМА</div><h2 class="panel-title">Играть</h2><p class="panel-sub">Выбери режим и настрой лобби.</p>'+
 DEMO_DATA.modes.map(m=>'<button class="mode-choice '+(state.mode===m.id?"active":"")+'" data-mode="'+m.id+'"><span class="mode-icon">'+m.icon+'</span><span style="flex:1"><b>'+esc(m.name)+'</b><small>'+esc(m.description)+'</small></span><span class="check">'+(state.mode===m.id?"✓":"")+'</span></button>').join("")+

 '<section class="card"><div class="card-head"><h2>УЧАСТНИКИ</h2><span style="font-size:10px;color:var(--muted)">'+people.length+' / '+cap()+'</span></div><div class="team-list">'+renderTeamRows()+'</div><div style="font-size:9px;color:var(--muted);line-height:1.5;margin-top:12px">'+(state.mode==="training"?"Тренировка запускается только для тебя.":'Приглашай друзей из списка слева. Когда друг присоединится, его агент появится рядом с твоим.')+'</div></section>'+
 '<section class="card"><div class="card-head"><h2>ПАРАМЕТРЫ</h2></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:10px;margin:11px 0"><span style="color:var(--muted)">Карта</span><b>'+esc(state.map)+'</b></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:10px;margin:11px 0"><span style="color:var(--muted)">Режим</span><b>'+esc(DEMO_DATA.modes.find(m=>m.id===state.mode).name)+'</b></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:10px;margin:11px 0"><span style="color:var(--muted)">Противники</span><b>'+(state.mode==="training"?"Нет":state.enemy==="bots"?"Боты":"Игроки")+'</b></div></section>'+
 '<div class="panel-actions"><button class="secondary-btn" data-open-view="modes">Назад</button><button class="primary-btn" id="startMatch">'+(state.mode==="training"?"ЗАПУСТИТЬ":"ГОТОВ")+' →</button></div>';

function settingsPanel(){
 return '<div class="eyebrow">ПЕРСОНАЛИЗАЦИЯ</div><h2 class="panel-title">Настройки</h2><p class="panel-sub">Настройки сохраняются на этом устройстве.</p>'+
 '<section class="card"><div class="card-head"><h2>ПРОФИЛЬ</h2></div><div class="avatar-settings">'+avatarHtml(DEMO_DATA.user)+'<div style="flex:1;min-width:0"><b style="font-size:11px">'+esc(DEMO_DATA.user.nickname)+'</b><small style="display:block;color:var(--muted);font-size:9px;margin-top:4px">Аватар профиля</small></div><button class="secondary-btn" id="uploadAvatar">Изменить</button></div><div class="setting-row" style="margin-top:10px"><div class="setting-copy"><b>Тема</b><small>Цвет акцента интерфейса</small></div><div class="themes"><button class="theme-chip '+(state.theme==="cyan"?"active":"")+'" data-theme="cyan" title="Бирюзовая"></button><button class="theme-chip '+(state.theme==="violet"?"active":"")+'" data-theme="violet" title="Фиолетовая"></button><button class="theme-chip '+(state.theme==="orange"?"active":"")+'" data-theme="orange" title="Оранжевая"></button></div></div><div class="setting-row"><div class="setting-copy"><b>Язык</b><small>Язык интерфейса</small></div><select id="languageSelect" class="select setting-control"><option value="ru" '+(state.language==="ru"?"selected":"")+'>Русский</option><option value="uk" '+(state.language==="uk"?"selected":"")+'>Українська</option><option value="en" '+(state.language==="en"?"selected":"")+'>English</option><option value="pl" '+(state.language==="pl"?"selected":"")+'>Polski</option></select></div></section>'+
 '<section class="card" style="margin-top:10px"><div class="card-head"><h2>ИГРА</h2></div><div class="setting-row"><div class="setting-copy"><b>Чувствительность</b><small id="sensitivityCaption">'+state.sensitivity+' / 10</small></div><input id="sensitivity" class="setting-control" type="range" min="1" max="10" value="'+state.sensitivity+'" style="accent-color:var(--accent)"></div><div class="setting-row"><div class="setting-copy"><b>Анимации в меню</b><small>Проигрывать анимации агентов</small></div><label class="switch"><input id="animationToggle" type="checkbox" '+(state.animation?"checked":"")+'><span></span></label></div><div class="setting-row"><div class="setting-copy"><b>Слабый ПК</b><small>Снижение качества 3D-рендера</small></div><label class="switch"><input id="lowToggle" type="checkbox" '+(state.low?"checked":"")+'><span></span></label></div><div class="setting-row"><div class="setting-copy"><b>Уменьшить движение</b><small>Снизить декоративную анимацию</small></div><label class="switch"><input id="reducedToggle" type="checkbox" '+(state.reduced?"checked":"")+'><span></span></label></div></section>';
}
function profilePanel(){
 return '<div class="eyebrow">АККАУНТ</div><h2 class="panel-title">Профиль</h2><p class="panel-sub">Демонстрационный профиль игрока.</p><section class="card"><div class="profile-card-row">'+avatarHtml(DEMO_DATA.user)+'<div><b>'+esc(DEMO_DATA.user.nickname)+'</b><small>ID '+esc(DEMO_DATA.user.id)+'</small></div></div><div class="field"><label>НИКНЕЙМ</label><input class="input" id="nicknameInput" maxlength="24" value="'+esc(DEMO_DATA.user.nickname)+'"></div><div class="field"><label>PLAYER ID</label><input class="input" disabled value="'+esc(DEMO_DATA.user.id)+'"></div><button class="primary-btn" id="saveProfile" style="width:100%">СОХРАНИТЬ</button></section>';

function simplePanel(which){
 const map={inventory:["Инвентарь","Экипировка и предметы появятся здесь после подключения данных."],market:["Рынок","Торговая площадка будет подключена к серверу."],clans:["Кланы","Список кланов и их участники появятся после подключения API."]};
 const d=map[which]||map.inventory;
 return '<div class="eyebrow">STANDOFFX</div><h2 class="panel-title">'+d[0]+'</h2><p class="panel-sub">'+d[1]+'</p><section class="card"><div class="empty-state">'+d[1]+'</div></section>';
}
function renderRightPanel(){
 const root=$("rightPanel");
 if(state.view==="home")root.innerHTML=renderHomePanel();
 else if(state.view==="modes")root.innerHTML=modePanel();
 else if(state.view==="lobby")root.innerHTML=lobbyPanel();
 else if(state.view==="settings")root.innerHTML=settingsPanel();
 else if(state.view==="profile")root.innerHTML=profilePanel();
 else root.innerHTML=simplePanel(state.view);
 root.querySelectorAll("[data-open-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.openView)));
 root.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{state.mode=b.dataset.mode;if(state.mode==="training")state.enemy="players";updateSceneLabels();renderRightPanel();if(window.__syncTeamActors)window.__syncTeamActors()}));
 root.querySelectorAll("[data-enemy]").forEach(b=>b.addEventListener("click",()=>{state.enemy=b.dataset.enemy;renderRightPanel();updateSceneLabels()}));
 const mapSelect=$("mapSelect");if(mapSelect)mapSelect.addEventListener("change",e=>{state.map=e.target.value;updateSceneLabels();renderRightPanel()});
 const continueButton=$("continueLobby");if(continueButton)continueButton.addEventListener("click",()=>setView("lobby"));
 const start=$("startMatch");if(start)start.addEventListener("click",()=>{toast(state.mode==="training"?"Тренировка":"Лобби",state.mode==="training"?"Демо-запуск тренировки. Игровая сцена подключается отдельно.":"Лобби подготовлено. Для настоящего матча нужен игровой сервер.")});
 const upload=$("uploadAvatar");if(upload)upload.addEventListener("click",()=>$("avatarFileInput").click());
 const themeButtons=root.querySelectorAll("[data-theme]");themeButtons.forEach(b=>b.addEventListener("click",()=>{state.theme=b.dataset.theme;persistSettings();renderRightPanel()}));
 const lang=$("languageSelect");if(lang)lang.addEventListener("change",e=>{state.language=e.target.value;persistSettings();toast("Язык", "Выбран "+e.target.options[e.target.selectedIndex].text+". Полные переводы подключим отдельно.")});
 const sensitivity=$("sensitivity");if(sensitivity)sensitivity.addEventListener("input",e=>{state.sensitivity=Number(e.target.value);$("sensitivityCaption").textContent=state.sensitivity+" / 10";localStorage.setItem("sx-sensitivity",String(state.sensitivity))});
 const animation=$("animationToggle");if(animation)animation.addEventListener("change",e=>{state.animation=e.target.checked;persistSettings()});
 const low=$("lowToggle");if(low)low.addEventListener("change",e=>{state.low=e.target.checked;persistSettings();toast("Графика",state.low?"Включён режим слабого ПК.":"Обычный режим.")});

 };
 const d=headings[view]||headings.home;$("welcomeOverline").textContent=d[0];$("welcomeTitle").textContent=d[1];$("welcomeSubtitle").textContent=d[2];
 renderRightPanel();paintUser();
}
function updateSceneLabels(){
 const m=DEMO_DATA.modes.find(x=>x.id===state.mode)||DEMO_DATA.modes[0];
 $("playModeIcon").textContent=m.icon;$("playModeName").textContent=m.name;
 $("playMapLine").textContent=state.map+" · "+(state.mode==="training"?"Соло":state.enemy==="bots"?"Боты":"Игроки");
 $("teamNumber").textContent=String(visibleMembers().length+1).padStart(2,"0");
 $("stageAgentHint").textContent=visibleMembers().length?visibleMembers().map(x=>x.nickname).join(" · ")+" в команде":"Только ты в лобби";
 $("miniSquadLabel").textContent="Твоя группа · "+(visibleMembers().length+1)+"/"+cap();
}
$("playButton").addEventListener("click",()=>setView("modes"));
$("showLobby").addEventListener("click",()=>setView("lobby"));
$("profileTop").addEventListener("click",()=>setView("profile"));
document.querySelectorAll(".topnav [data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("friendSearch").addEventListener("input",e=>{state.search=e.target.value;renderFriends()});
document.querySelectorAll("[data-friend-filter]").forEach(b=>b.addEventListener("click",()=>{state.friendFilter=b.dataset.friendFilter;document.querySelectorAll("[data-friend-filter]").forEach(x=>x.classList.toggle("active",x===b));renderFriends()}));
$("avatarFileInput").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){toast("Аватар","Выбери PNG, JPG или WEBP.");return}if(file.size>10*1024*1024){toast("Аватар","Максимальный размер — 10 МБ.");return}try{const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const image=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=raw});const c=document.createElement("canvas");c.width=256;c.height=256;const ctx=c.getContext("2d");const side=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);DEMO_DATA.user.avatar=c.toDataURL("image/jpeg",.8);persistProfile();paintUser();renderRightPanel();toast("Аватар","Изображение обновлено.")}catch{toast("Аватар","Не удалось обработать изображение.")}finally{e.target.value=""}});
paintUser();renderFriends();updateSceneLabels();renderRightPanel();persistSettings();
</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

const canvas=document.getElementById("agentCanvas");
const stage=document.getElementById("agentStage");
const state=window.STANDOFFX_MENU.state;
const user=window.STANDOFFX_MENU.user;
const friends=window.STANDOFFX_MENU.friends;
const baseURL="https://raw.githubusercontent.com/standoffX/3d-models/main/";
const loader=new FBXLoader();
const clock=new THREE.Clock();
let renderer=null,scene=null,camera=null,raf=null,dragStart=null,rotation=0;
const displays=new Map();
const palette=[0x438c9a,0x9674be,0x6683a6,0x6e9c88,0xb18d61];
function setStageStatus(s){document.getElementById("stageStatus").textContent=s}
function normalizeSourcePerson(p,isUser){return{id:String(p.id),nickname:p.nickname||"Player",fbx:p.fbx||(isUser?"Excited.fbx":"Talking On Phone.fbx"),color:p.color||palette[0],isUser:!!isUser,avatar:p.avatar||""}}
function getActivePeople(){
 const base=normalizeSourcePerson(user,true);
 const active=state.mode==="training"?[]:(state.members||[]);
 return [base,...active.map(p=>normalizeSourcePerson(p,false))].slice(0,4);
}
function standardMat(color,roughness){return new THREE.MeshStandardMaterial({color:color,roughness:roughness==null?.78:roughness,metalness:.05})}
function makeFallbackActor(person){
 const group=new THREE.Group();
 const uniform=standardMat(person.isUser?0x405969:(person.color||0x478995));
 const darker=standardMat(0x172430);
 const pants=standardMat(0x26323c);
 const helmet=standardMat(person.isUser?0x9aa7ae:0x667a86);
 const skin=standardMat(0xb28c74);
 function cube(name,mat,w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.name=name;m.position.set(x,y,z);m.castShadow=false;m.receiveShadow=false;group.add(m);return m}
 function sphere(name,mat,r,x,y,z,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat);m.name=name;m.position.set(x,y,z);m.scale.set(sx||1,sy||1,sz||1);group.add(m);return m}
 function limb(name,mat,x,y,z,h,r){const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,h,3,6),mat);m.name=name;m.position.set(x,y,z);group.add(m);return m}
 limb("left-leg",pants,-.13,.67,0,.8,.115);limb("right-leg",pants,.13,.67,0,.8,.115);
 cube("boots",darker,.22,.13,.38,-.13,.13,.07);cube("boots",darker,.22,.13,.38,.13,.13,.07);
 cube("torso",uniform,.55,.88,.31,0,1.58,0);
 cube("vest",darker,.36,.61,.34,0,1.61,.17);
 sphere("shoulder-left",uniform,.19,-.35,1.92,1.1,1,1);sphere("shoulder-right",uniform,.19,.35,1.92,1.1,1,1);
 limb("left-arm",uniform,-.4,1.55,.01,.6,.09);limb("right-arm",uniform,.4,1.55,.01,.6,.09);
 sphere("left-hand",skin,.1,-.4,1.2,.9,1,1);sphere("right-hand",skin,.1,.4,1.2,.9,1,1);
 limb("neck",skin,0,2.09,0,.18,.095);sphere("head",skin,.225,0,2.35,0,1,1.2,1);
 sphere("helmet",helmet,.25,0,2.49,0,1.05,.55,1);
 cube("visor",darker,.34,.09,.06,0,2.38,.2);
 group.userData.fallback=true;
 return group
}
function makeLight(){
 scene.add(new THREE.HemisphereLight(0xd9f7ff,0x242b35,2.05));
 const key=new THREE.DirectionalLight(0xfff7eb,2.3);key.position.set(3,6,5);scene.add(key);
 const rim=new THREE.DirectionalLight(0x2dd6e7,2.15);rim.position.set(-4,3,-4);scene.add(rim);
 const ground=new THREE.Mesh(new THREE.CircleGeometry(3.6,48),new THREE.MeshBasicMaterial({color:0x0c151c,transparent:true,opacity:.55}));
 ground.rotation.x=-Math.PI/2;ground.position.y=.015;scene.add(ground)
}
function initRenderer(){
 try{
  renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:false,powerPreference:"low-power"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,state.low?.65:1.15));
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(39,1,.1,100);camera.position.set(0,2.45,10.7);camera.lookAt(0,1.57,0);
  makeLight();resizeRenderer();window.addEventListener("resize",resizeRenderer);animate();setStageStatus("АГЕНТЫ · 3D");return true
 }catch(err){console.warn("WebGL unavailable; keeping the stage fallback.",err);setStageStatus("АГЕНТЫ");return false}
}
function resizeRenderer(){if(!renderer||!camera)return;const w=canvas.clientWidth||760,h=canvas.clientHeight||530;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function removeDisplay(id){const d=displays.get(id);if(!d)return;if(d.mixer)d.mixer.stopAllAction();if(d.group&&scene)scene.remove(d.group);displays.delete(id)}
function layoutDisplays(){
 const people=getActivePeople();const n=people.length;const spacing=n>=4?1.72:n===3?1.88:n===2?1.65:0;
 people.forEach((p,i)=>{const d=displays.get(p.id);if(!d)return;d.group.position.x=n===1?0:(i-(n-1)/2)*spacing;d.targetX=d.group.position.x;d.group.rotation.y=(i-(n-1)/2)*-.035;d.baseY=0});
 document.getElementById("teamNumber").textContent=String(n).padStart(2,"0");
 document.getElementById("stageAgentHint").textContent=n>1?people.slice(1).map(p=>p.nickname).join(" · ")+" в твоей команде":"Твой агент в лобби";
 document.getElementById("stageMembers").innerHTML=people.slice(1).map(p=>'<div class="agent-name-pill">'+escapeHtml(p.nickname)+'<span>●</span></div>').join("");
 stage.classList.add("scene-ready")
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addDisplay(person){
 if(displays.has(person.id)||!scene)return;
 const group=new THREE.Group();group.position.set(0,0,0);scene.add(group);
 const d={id:person.id,person:person,group:group,mixer:null,model:null,fallback:true,phase:Math.random()*6.28,targetX:0,baseY:0};
 const fallback=makeFallbackActor(person);group.add(fallback);d.model=fallback;displays.set(person.id,d);
 const file=encodeURIComponent(person.fbx).replace(/%2F/gi,"/");
 loader.load(baseURL+file,obj=>{
  if(!displays.has(person.id)){return}
  let hasMesh=false;obj.traverse(n=>{if(n.isMesh){hasMesh=true;n.frustumCulled=false;n.castShadow=false;n.receiveShadow=false;if(n.material&&Array.isArray(n.material))n.material.forEach(m=>m.side=THREE.DoubleSide);else if(n.material)n.material.side=THREE.DoubleSide}});
  if(!hasMesh||!obj.animations||!obj.animations.length){console.warn("FBX had no visible mesh or animation; using 3D fallback:",person.fbx);return}
  const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());
  const factor=3.35/(size.y||Math.max(size.x,size.z)||1);obj.scale.setScalar(factor);obj.position.set(-center.x*factor,-box.min.y*factor,-center.z*factor);
  const current=displays.get(person.id);if(!current)return;
  current.group.remove(current.model);current.group.add(obj);current.model=obj;current.fallback=false;
  current.mixer=new THREE.AnimationMixer(obj);
  obj.animations.forEach((clip,index)=>{const action=current.mixer.clipAction(clip);action.enabled=true;action.setLoop(THREE.LoopRepeat,Infinity);action.clampWhenFinished=false;if(index===0)action.play()});
  setStageStatus("АГЕНТЫ · АНИМАЦИЯ");
 },undefined,err=>{console.warn("FBX load failed; 3D fallback will stay visible:",person.fbx,err);setStageStatus("АГЕНТЫ · IDLE")});
 layoutDisplays()
}
function syncTeamActors(){
 if(!scene){return}
 const people=getActivePeople();const wanted=new Set(people.map(p=>p.id));
 [...displays.keys()].forEach(id=>{if(!wanted.has(id))removeDisplay(id)});
 people.forEach(p=>addDisplay(p));
 layoutDisplays()
}
function animate(){
 raf=requestAnimationFrame(animate);if(!renderer||!scene||!camera)return;
 const dt=Math.min(clock.getDelta(),.05);const time=performance.now()*.001;
 for(const d of displays.values()){
  if(d.mixer&&state.animation&&!state.reduced)d.mixer.update(dt);
  if(d.group){const bob=state.animation&&!state.reduced?Math.sin(time*1.45+d.phase)*.025:0;d.group.position.y+=(bob-d.group.position.y)*Math.min(1,dt*3)}
  if(d.fallback&&d.model){d.model.rotation.y=state.animation&&!state.reduced?Math.sin(time*.65+d.phase)*.045:0;d.model.position.y=state.animation&&!state.reduced?Math.sin(time*1.6+d.phase)*.035:0}
 }
 renderer.render(scene,camera)
}
function applyQuality(low){if(!renderer)return;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,low?.65:1.15));resizeRenderer()}
function applyMotion(on){if(!on||state.reduced){for(const d of displays.values())if(d.mixer)d.mixer.timeScale=0}else{for(const d of displays.values())if(d.mixer)d.mixer.timeScale=1}}
window.__syncTeamActors=syncTeamActors;window.__menuSetQuality=applyQuality;window.__menuSetMotion=applyMotion;
canvas.addEventListener("pointerdown",e=>{dragStart={x:e.clientX,rotation:rotation};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!dragStart||!state.animation)return;rotation=dragStart.rotation+(e.clientX-dragStart.x)*.002;for(const d of displays.values())d.group.rotation.y=rotation+(d.targetX*.015)});
canvas.addEventListener("pointerup",()=>dragStart=null);canvas.addEventListener("pointercancel",()=>dragStart=null);
if(initRenderer())syncTeamActors();
else{stage.classList.remove("scene-ready");setStageStatus("АГЕНТЫ");}
</script>
</body>
