<script>

const DEMO_DATA={

};
try{const saved=JSON.parse(localStorage.getItem("sx-menu-profile")||"null");if(saved&&typeof saved==="object")Object.assign(DEMO_DATA.user,saved)}catch{}

window.STANDOFFX_MENU={state:state,user:DEMO_DATA.user,friends:DEMO_DATA.friends};

function persistProfile(){try{localStorage.setItem("sx-menu-profile",JSON.stringify(DEMO_DATA.user))}catch{toast("Профиль","Не удалось сохранить фото. Попробуй изображение меньше.")}}
function paintUser(){const u=DEMO_DATA.user;["topAvatar","miniAvatar"].forEach(id=>{const n=$(id);n.innerHTML=u.avatar?'<img alt="" src="'+esc(u.avatar)+'">':esc((u.nickname||"?").slice(0,1).toUpperCase())});$("topName").textContent=u.nickname;$("topMeta").textContent="ID "+u.id+" · УРОВЕНЬ "+u.level;$("goldValue").textContent=Number(u.gold).toLocaleString("ru-RU");$("coinValue").textContent=Number(u.coins).toLocaleString("ru-RU");$("stageTitle").textContent=u.nickname.toUpperCase();$("partyLabel").textContent=u.nickname+" · "+(state.mode==="training"?1:state.members.length+1)+"/4"}
function persistSettings(){localStorage.setItem("sx-theme",state.theme);localStorage.setItem("sx-language",state.language);localStorage.setItem("sx-animation",String(state.animation));localStorage.setItem("sx-low-effects",String(state.low));localStorage.setItem("sx-reduce-motion",String(state.reduced));localStorage.setItem("sx-sensitivity",String(state.sensitivity));document.documentElement.classList.toggle("theme-blue",state.theme==="blue");document.documentElement.classList.toggle("theme-orange",state.theme==="orange");document.body.classList.toggle("low-effects",state.low);if(window.__menuSetQuality)window.__menuSetQuality(state.low);if(window.__menuSetMotion)window.__menuSetMotion(state.animation&&!state.reduced)}
function visibleFriends(){const q=state.search.toLowerCase();return DEMO_DATA.friends.filter(f=>(f.nickname+" "+f.id).toLowerCase().includes(q)&&(state.filter==="all"||(state.filter==="online"&&f.online)||(state.filter==="invited"&&state.joined.has(f.id))))}
function renderFriends(){const on=DEMO_DATA.friends.filter(f=>f.online).length;$("onlineCaption").textContent=on+" игрока в сети";$("friendList").innerHTML=visibleFriends().map(f=>{const joined=state.joined.has(f.id),pending=state.invited.has(f.id)&&!joined;const disabled=state.mode==="training";const action=joined?'<button class="invite joined" disabled>✓</button>':pending?'<button class="invite pending" disabled>…</button>':f.online&&!disabled?'<button class="invite" data-invite="'+esc(f.id)+'">＋</button>':'<button class="invite" disabled>−</button>';return '<div class="friend">'+avatarHtml(f)+'<div class="friend-info"><b>'+esc(f.nickname)+'</b><small><i class="presence '+(f.online?"online":"")+'"></i>'+esc(joined?"В лобби":pending?"Приглашение отправлено":f.status)+'</small></div>'+action+'</div>'}).join("")||'<div class="no-friends">Игроки не найдены</div>';$("friendList").querySelectorAll("[data-invite]").forEach(b=>b.addEventListener("click",()=>inviteFriend(b.dataset.invite)))}
function inviteFriend(id){if(state.mode==="training"){toast("Тренировка","В этом режиме ты играешь один.");return}const friend=DEMO_DATA.friends.find(f=>f.id===id);if(!friend||!friend.online||state.joined.has(id)||state.invited.has(id))return;if(state.members.length>=3){toast("Команда заполнена","Максимум четыре участника.");return}state.invited.add(id);renderFriends();toast("Приглашение","Отправлено игроку "+friend.nickname+".");setTimeout(()=>{if(state.mode==="training"||state.joined.has(id))return;if(state.members.length>=3){state.invited.delete(id);renderFriends();return}state.invited.delete(id);state.joined.add(id);state.members.push({id:friend.id,nickname:friend.nickname,avatar:"",fbx:friend.fbx,color:friend.color});friend.status="В лобби";renderFriends();renderRightPanel();updateDock();updateStageText();if(window.__syncTeamActors)window.__syncTeamActors();toast(friend.nickname,"Вошёл в лобби — его агент появился рядом.")},1050)}
function updateDock(){const m=DEMO_DATA.modes.find(x=>x.id===state.mode)||DEMO_DATA.modes[0];$("dockIcon").textContent=m.icon;$("dockMode").textContent=m.name.toUpperCase();$("dockMap").textContent=state.map+" · "+(state.mode==="training"?"Соло":state.enemy==="bots"?"Боты":"Несколько карт");$("partyLabel").textContent=DEMO_DATA.user.nickname+" · "+(state.mode==="training"?1:state.members.length+1)+"/4";$("teamSize").textContent=String(state.mode==="training"?1:state.members.length+1).padStart(2,"0")}
function updateStageText(){const team=state.mode==="training"?[]:state.members;$("stageSubtitle").textContent=team.length?team.map(p=>p.nickname).join(" · ")+" · Группа собрана":"Твой агент · Готов к матчу";updateDock()}
function promoHome(){return '<section class="profile-widget"><div class="widget-head"><b>ПРОФИЛЬ ИГРОКА</b><button class="textlink" data-view="profile">ПРОФИЛЬ ↗</button></div><div class="profile-line">'+avatarHtml(DEMO_DATA.user)+'<div><b>'+esc(DEMO_DATA.user.nickname)+'</b><small>ID '+esc(DEMO_DATA.user.id)+'</small></div></div><div class="rank-line"><div class="rank-icon">✦</div><div><b>Серебро III</b><small>Уровень '+DEMO_DATA.user.level+' · 1 260 / 2 000 XP</small></div></div></section><button class="promo" data-view="events"><small>META-EVENT</small><strong>СОБЫТИЕ СЕЗОНА</strong><span>Испытания и награды</span></button><div class="promo-grid"><button class="promo" data-view="events"><small>СОБЫТИЯ</small><strong>НОВОСТИ ↗</strong></button><button class="promo starter" data-view="inventory"><small>STARTER PASS</small><strong>ОТКРЫТЬ ↗</strong></button></div><button class="promo battle" data-view="inventory"><small>BATTLE PASS</small><strong>СЕЗОН 12</strong><span>Награды и прогресс</span></button><button class="promo" data-view="market"><small>МАГАЗИН</small><strong>КОЛЛЕКЦИИ ↗</strong><span>Предметы и предложения</span></button>'}
function membersHtml(){const p=[{...DEMO_DATA.user,host:true},...(state.mode==="training"?[]:state.members)];return p.map(m=>'<div class="member">'+avatarHtml(m)+'<div class="member-copy"><b>'+esc(m.nickname)+(m.host?" (вы)":"")+'</b><small>ID '+esc(m.id)+'</small></div><span class="ready">'+(m.host?"Лидер":"В лобби")+'</span></div>').join("")}
function modesView(){return '<div class="view-head"><small>ВЫБОР РЕЖИМА</small><h2>Играть</h2><p>Выбери режим и настройки матча.</p></div>'+DEMO_DATA.modes.map(m=>'<button class="mode-option '+(state.mode===m.id?"active":"")+'" data-mode="'+m.id+'"><span class="mode-symbol">'+m.icon+'</span><span class="mode-copy"><b>'+esc(m.name)+'</b><small>'+esc(m.description)+'</small></span><span class="mode-check">'+(state.mode===m.id?"✓":"")+'</span></button>').join("")+'<div class="field"><label>КАРТА</label><select id="mapSelect" class="select">'+DEMO_DATA.maps.map(m=>'<option '+(state.map===m?"selected":"")+'>'+esc(m)+'</option>').join("")+'</select></div>'+(state.mode==="training"?"":'<div class="field"><label>СОСТАВ</label><div class="segments"><button class="'+(state.enemy==="players"?"active":"")+'" data-enemy="players">Игроки</button><button class="'+(state.enemy==="bots"?"active":"")+'" data-enemy="bots">Боты</button></div></div>')+'<button class="tiny-button full" data-view="home">← НАЗАД</button>'}
function lobbyView(){return '<div class="view-head"><small>КОМАНДА</small><h2>Лобби</h2><p>'+esc(DEMO_DATA.modes.find(m=>m.id===state.mode).name)+' · '+esc(state.map)+'</p></div><section class="panel-card"><div class="panel-card-title">УЧАСТНИКИ · '+(state.mode==="training"?1:state.members.length+1)+' / '+(state.mode==="training"?1:4)+'</div>'+membersHtml()+'</section><section class="panel-card"><div class="panel-card-title">ПАРАМЕТРЫ МАТЧА</div><div class="row-setting"><div><b>Карта</b><small>'+esc(state.map)+'</small></div></div><div class="row-setting"><div><b>Состав</b><small>'+(state.mode==="training"?"Соло":state.enemy==="bots"?"Боты":"Игроки")+'</small></div></div><div class="row-setting"><div><b>Закрытая группа</b><small>Демо-настройка</small></div><label class="switch"><input type="checkbox" id="privateLobby" checked><span></span></label></div></section><button class="tiny-button full" data-view="modes">← СМЕНИТЬ РЕЖИМ</button>'}
function settingsView(){return '<div class="view-head"><small>ПЕРСОНАЛИЗАЦИЯ</small><h2>Настройки</h2><p>Сохраняются на этом устройстве.</p></div><section class="panel-card"><div class="panel-card-title">ПРОФИЛЬ</div><div class="row-setting"><div class="avatar-setting">'+avatarHtml(DEMO_DATA.user)+'<div><b>Аватар</b><small>Изображение с устройства</small></div></div><button class="tiny-button" id="uploadAvatar">ИЗМЕНИТЬ</button></div><div class="row-setting"><div><b>Тема</b></div><div class="themes"><button class="theme-chip '+(state.theme==="green"?"active":"")+'" data-theme="green" title="Зелёная"></button><button class="theme-chip '+(state.theme==="blue"?"active":"")+'" data-theme="blue" title="Голубая"></button><button class="theme-chip '+(state.theme==="orange"?"active":"")+'" data-theme="orange" title="Оранжевая"></button></div></div><div class="row-setting"><div><b>Язык</b></div><select class="select" id="languageSelect" style="width:104px"><option value="ru" '+(state.language==="ru"?"selected":"")+'>Русский</option><option value="uk" '+(state.language==="uk"?"selected":"")+'>Українська</option><option value="en" '+(state.language==="en"?"selected":"")+'>English</option><option value="pl" '+(state.language==="pl"?"selected":"")+'>Polski</option></select></div></section><section class="panel-card"><div class="panel-card-title">ИГРА</div><div class="row-setting"><div><b>Чувствительность</b><small id="sensitivityText">'+state.sensitivity+' / 10</small></div><input id="sensitivity" class="range" type="range" min="1" max="10" value="'+state.sensitivity+'"></div><div class="row-setting"><div><b>Анимации</b><small>Проигрывать анимации агентов</small></div><label class="switch"><input id="animationToggle" type="checkbox" '+(state.animation?"checked":"")+'><span></span></label></div><div class="row-setting"><div><b>Слабый ПК</b><small>Снизить качество сцены</small></div><label class="switch"><input id="lowToggle" type="checkbox" '+(state.low?"checked":"")+'><span></span></label></div><div class="row-setting"><div><b>Меньше движения</b><small>Отключить декоративные эффекты</small></div><label class="switch"><input id="reducedToggle" type="checkbox" '+(state.reduced?"checked":"")+'><span></span></label></div></section>'}

function simpleView(view){const data={inventory:["ИНВЕНТАРЬ","Предметы и экипировка появятся здесь после подключения данных."],market:["РЫНОК","Каталог предметов и торговые предложения."],clans:["КЛАНЫ","Кланы и участники появятся после подключения сервера."],events:["СОБЫТИЯ","Новости, бонусы, промокоды и награды."]};const d=data[view]||data.events;return '<div class="view-head"><small>'+d[0]+'</small><h2>'+({inventory:"Инвентарь",market:"Рынок",clans:"Кланы",events:"События"}[view]||"Раздел")+'</h2><p>'+d[1]+'</p></div><section class="panel-card"><div class="panel-card-title">STANDOFFX</div><small style="font-size:8px;line-height:1.6;color:var(--muted)">'+d[1]+'</small></section><button class="tiny-button full" data-view="home">← ГЛАВНАЯ</button>'}
function renderRightPanel(){const root=$("rightPanel");root.dataset.view=state.view;if(state.view==="home")root.innerHTML=promoHome();else if(state.view==="modes")root.innerHTML=modesView();else if(state.view==="lobby")root.innerHTML=lobbyView();else if(state.view==="settings")root.innerHTML=settingsView();else if(state.view==="profile")root.innerHTML=profileView();else root.innerHTML=simpleView(state.view);
 root.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
 root.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{state.mode=b.dataset.mode;if(state.mode==="training")state.enemy="players";updateDock();updateStageText();renderFriends();renderRightPanel();if(window.__syncTeamActors)window.__syncTeamActors()}));
 root.querySelectorAll("[data-enemy]").forEach(b=>b.addEventListener("click",()=>{state.enemy=b.dataset.enemy;updateDock();renderRightPanel()}));
 const map=$("mapSelect");if(map)map.addEventListener("change",e=>{state.map=e.target.value;updateDock();renderRightPanel()});
 const upload=$("uploadAvatar");if(upload)upload.addEventListener("click",()=>$("avatarFile").click());
 root.querySelectorAll("[data-theme]").forEach(b=>b.addEventListener("click",()=>{state.theme=b.dataset.theme;persistSettings();renderRightPanel()}));
 const lang=$("languageSelect");if(lang)lang.addEventListener("change",e=>{state.language=e.target.value;persistSettings();toast("Язык","Выбран "+e.target.options[e.target.selectedIndex].text+". Полные переводы подключаются отдельно.")});
 const sens=$("sensitivity");if(sens)sens.addEventListener("input",e=>{state.sensitivity=Number(e.target.value);$("sensitivityText").textContent=state.sensitivity+" / 10";localStorage.setItem("sx-sensitivity",String(state.sensitivity))});
 const ani=$("animationToggle");if(ani)ani.addEventListener("change",e=>{state.animation=e.target.checked;persistSettings()});
 const low=$("lowToggle");if(low)low.addEventListener("change",e=>{state.low=e.target.checked;persistSettings();toast("Графика",state.low?"Включён режим слабого ПК.":"Обычное качество графики.")});
 const reduced=$("reducedToggle");if(reduced)reduced.addEventListener("change",e=>{state.reduced=e.target.checked;persistSettings()});
 const save=$("saveProfile");if(save)save.addEventListener("click",()=>{const nick=$("nickname").value.trim().slice(0,24);if(!nick){toast("Профиль","Никнейм не может быть пустым.");return}DEMO_DATA.user.nickname=nick;persistProfile();paintUser();renderRightPanel();toast("Профиль","Никнейм сохранён.")});
 const privateToggle=$("privateLobby");if(privateToggle)privateToggle.addEventListener("change",()=>toast("Лобби","Настройка изменена локально."));
}
function setView(view){state.view=view;document.querySelectorAll(".nav-button").forEach(b=>b.classList.toggle("active",b.dataset.view===view||(view==="profile"&&b.dataset.view==="home")));renderRightPanel();$("stageStatus").textContent=view==="home"?"АГЕНТЫ · ЛОББИ":view==="modes"?"ВЫБОР РЕЖИМА":view==="lobby"?"ЛОББИ КОМАНДЫ":view==="settings"?"НАСТРОЙКИ":view==="profile"?"ПРОФИЛЬ ИГРОКА":view.toUpperCase()}
$("gearButton").addEventListener("click",()=>setView("settings"));$("profileButton").addEventListener("click",()=>setView("profile"));$("manageFriends").addEventListener("click",()=>{setView("home");$("friendSearch").focus()});$("openLobby").addEventListener("click",()=>setView("lobby"));$("modeDock").addEventListener("click",()=>setView(state.view==="modes"?"home":"modes"));$("changeMode").addEventListener("click",e=>{e.stopPropagation();setView("modes")});
$("playButton").addEventListener("click",()=>{if(state.view==="modes"){setView("lobby");return}if(state.view==="lobby"){toast(state.mode==="training"?"Тренировка":"Лобби готово",state.mode==="training"?"Демо-запуск тренировки.":"Это прототип без подключённого сервера.");return}if(state.view!=="home"){setView("home");return}toast("Выбран режим",DEMO_DATA.modes.find(m=>m.id===state.mode).name+" · "+state.map+". Для поиска матча нужен сервер.")});
document.querySelectorAll(".nav-button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("friendSearch").addEventListener("input",e=>{state.search=e.target.value;renderFriends()});
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{state.filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));renderFriends()}));
$("addFriend").addEventListener("click",()=>toast("Добавить друга","Поиск по ID подключим к серверу."));
$("avatarFile").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast("Аватар","Выбери PNG, JPG или WEBP.");return}if(f.size>10*1024*1024){toast("Аватар","Максимум 10 МБ.");return}try{const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});const s=Math.min(img.width,img.height);const c=document.createElement("canvas");c.width=c.height=256;c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);DEMO_DATA.user.avatar=c.toDataURL("image/jpeg",.8);persistProfile();paintUser();renderRightPanel();toast("Аватар","Изображение сохранено.")}catch{toast("Аватар","Не удалось обработать изображение.")}finally{e.target.value=""}});
paintUser();renderFriends();updateDock();updateStageText();renderRightPanel();persistSettings();
</script>
<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";
const canvas=document.getElementById("agentCanvas"),stage=document.getElementById("stage");
const state=window.STANDOFFX_MENU.state,user=window.STANDOFFX_MENU.user,loader=new FBXLoader(),clock=new THREE.Clock(),actors=new Map();
const modelBase="https://raw.githubusercontent.com/standoffX/3d-models/main/";
let renderer=null,scene=null,camera=null,drag=null,rotation=0;
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function people(){return [{...user,fbx:"Excited.fbx",isUser:true},...(state.mode==="training"?[]:state.members)].slice(0,4)}
function mesh(g,m,p,s){const o=new THREE.Mesh(g,m);o.position.set(p[0],p[1],p[2]);if(s)o.scale.set(s[0],s[1],s[2]);o.castShadow=false;o.receiveShadow=false;return o}
function fallback(p){const group=new THREE.Group(),gear=new THREE.MeshStandardMaterial({color:p.isUser?0x677780:(p.color||0x536c7b),roughness:.85}),dark=new THREE.MeshStandardMaterial({color:0x263139,roughness:.88}),pants=new THREE.MeshStandardMaterial({color:0x373c40,roughness:.9}),helmet=new THREE.MeshStandardMaterial({color:0x838c91,roughness:.7}),skin=new THREE.MeshStandardMaterial({color:0xa67e68,roughness:.9});function cap(mat,x,y,z,h,r){group.add(mesh(new THREE.CapsuleGeometry(r,h,3,7),mat,[x,y,z]))}cap(pants,-.14,.66,0,.83,.105);cap(pants,.14,.66,0,.83,.105);group.add(mesh(new THREE.BoxGeometry(.24,.12,.39),dark,[-.14,.13,.05]));group.add(mesh(new THREE.BoxGeometry(.24,.12,.39),dark,[.14,.13,.05]));group.add(mesh(new THREE.BoxGeometry(.56,.84,.32),gear,[0,1.54,0]));group.add(mesh(new THREE.BoxGeometry(.37,.58,.34),dark,[0,1.58,.17]));cap(gear,-.37,1.52,0,.62,.088);cap(gear,.37,1.52,0,.62,.088);group.add(mesh(new THREE.SphereGeometry(.095,10,8),skin,[-.38,1.17,.02]));group.add(mesh(new THREE.SphereGeometry(.095,10,8),skin,[.38,1.17,.02]));group.add(mesh(new THREE.CylinderGeometry(.088,.088,.2,10),skin,[0,2.02,0]));group.add(mesh(new THREE.SphereGeometry(.22,14,10),skin,[0,2.29,0],[.9,1.15,.9]));group.add(mesh(new THREE.SphereGeometry(.246,14,9),helmet,[0,2.43,0],[1.03,.57,1]));group.add(mesh(new THREE.BoxGeometry(.33,.085,.07),dark,[0,2.34,.19]));group.userData.fallback=true;return group}
function domFallback(){const svg='<svg viewBox="0 0 170 400" xmlns="http://www.w3.org/2000/svg" fill="none"><defs><linearGradient id="v" x1="25" y1="100" x2="145" y2="300"><stop stop-color="#aeb8bb"/><stop offset=".5" stop-color="#59696f"/><stop offset="1" stop-color="#252e33"/></linearGradient></defs><ellipse cx="85" cy="386" rx="43" ry="7" fill="#000" opacity=".35"/><path d="M61 274 47 344 37 371 57 379 79 329 89 282Zm46 0 13 68 18 27-21 11-26-36-8-47Z" fill="#2b343a" stroke="#60696e" stroke-width="4"/><path d="M52 141 29 178 38 242 61 234 71 190Zm67 0 21 37-9 62-22-7-10-45Z" fill="url(#v)" stroke="#939fa3" stroke-width="4"/><path d="M57 137h57l17 54-12 93-35 19-43-19-8-87Z" fill="url(#v)" stroke="#8e9b9e" stroke-width="4"/><path d="m62 160 23 29 23-29m-23 29v70" stroke="#222d33" stroke-width="6"/><path d="M72 111h27v35H72Z" fill="#a98269"/><path d="M49 68Q50 30 85 28q38 2 37 41l-4 41q-11 28-33 29-26-4-33-31Z" fill="#66757c" stroke="#a6afb0" stroke-width="4"/><path d="M48 77q37-10 75 0l-3 16q-36-9-69 0Z" fill="#10171d" stroke="#687a82" stroke-width="4"/><path d="M73 105h11m9 0h10" stroke="#1b2930" stroke-width="5" stroke-linecap="round"/></svg>';const root=document.getElementById("domActors");root.innerHTML=people().map((p,i)=>'<div class="dom-actor">'+svg+'<div class="actor-label">'+escapeHtml(p.nickname)+(i===0?" · ВЫ":"")+'</div></div>').join("")}
function status(t){document.getElementById("stageStatus").textContent=t}
function resize(){if(!renderer||!camera)return;const w=canvas.clientWidth||700,h=canvas.clientHeight||500;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function init(){try{renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:false,powerPreference:"low-power"});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,state.low?.62:1.15));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,2.55,9.6);camera.lookAt(0,1.5,0);scene.add(new THREE.HemisphereLight(0xe8eff3,0x262b30,2));const key=new THREE.DirectionalLight(0xfff5e8,2.4);key.position.set(3,6,5);scene.add(key);const rim=new THREE.DirectionalLight(0xaab9c0,1.4);rim.position.set(-4,3,-4);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(4.7,64),new THREE.MeshBasicMaterial({color:0x252a2e,transparent:true,opacity:.45}));floor.rotation.x=-Math.PI/2;floor.position.y=.005;scene.add(floor);resize();window.addEventListener("resize",resize);animate();return true}catch(e){console.warn("WebGL unavailable; animated fallback enabled",e);stage.classList.add("no-webgl");domFallback();return false}}
function arrange(){const p=people(),n=p.length,space=n===4?1.75:n===3?1.9:n===2?1.8:0;p.forEach((person,i)=>{const a=actors.get(String(person.id));if(!a)return;a.x=n===1?0:(i-(n-1)/2)*space;a.group.position.x=a.x;a.group.rotation.y=(i-(n-1)/2)*-.02});$("teamSize").textContent=String(n).padStart(2,"0");$("stageSubtitle").textContent=n>1?p.slice(1).map(x=>x.nickname).join(" · ")+" · Группа собрана":"Твой агент · Готов к матчу"}
function addActor(p){const id=String(p.id);if(actors.has(id)||!scene)return;const group=new THREE.Group(),model=fallback(p);group.add(model);scene.add(group);const a={id:id,p:p,group:group,model:model,mixer:null,fallback:true,x:0,phase:Math.random()*6.28};actors.set(id,a);const url=modelBase+encodeURIComponent(p.fbx||"Excited.fbx");loader.load(url,obj=>{if(!actors.has(id))return;let meshCount=0;obj.traverse(o=>{if(o.isMesh){meshCount++;o.frustumCulled=false;if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.side=THREE.DoubleSide);else o.material.side=THREE.DoubleSide}}});if(!meshCount||!obj.animations||!obj.animations.length){console.warn("FBX contains no visible animated model; use 3D fallback:",p.fbx);return}const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),scale=3.8/(size.y||1);obj.scale.setScalar(scale);obj.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);const cur=actors.get(id);if(!cur)return;cur.group.remove(cur.model);cur.group.add(obj);cur.model=obj;cur.fallback=false;cur.mixer=new THREE.AnimationMixer(obj);obj.animations.forEach((clip,i)=>{const action=cur.mixer.clipAction(clip);action.setLoop(THREE.LoopRepeat,Infinity);action.clampWhenFinished=false;if(i===0)action.play()});arrange();status("АГЕНТЫ · АНИМАЦИИ")},undefined,e=>{console.warn("FBX load failed:",p.fbx,e);status("АГЕНТЫ · ЛОББИ")});arrange()}
function sync(){if(!scene){domFallback();return}const p=people(),ids=new Set(p.map(x=>String(x.id)));Array.from(actors.keys()).forEach(id=>{if(!ids.has(id)){const a=actors.get(id);if(a.mixer)a.mixer.stopAllAction();scene.remove(a.group);actors.delete(id)}});p.forEach(addActor);arrange()}
function animate(){requestAnimationFrame(animate);if(!renderer||!scene||!camera)return;const dt=Math.min(clock.getDelta(),.05),t=performance.now()*.001;for(const a of actors.values()){if(a.mixer){a.mixer.timeScale=state.animation&&!state.reduced?1:0;a.mixer.update(dt)}a.group.position.y=state.animation&&!state.reduced?Math.sin(t*1.2+a.phase)*.017:0;if(a.fallback)a.model.rotation.y=state.animation&&!state.reduced?Math.sin(t*.6+a.phase)*.045:0}renderer.render(scene,camera)}
window.__syncTeamActors=sync;window.__menuSetQuality=low=>{if(renderer){renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,low?.62:1.15));resize()}};window.__menuSetMotion=on=>{for(const a of actors.values())if(a.mixer)a.mixer.timeScale=on?1:0};
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,rot:rotation};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointermove",e=>{if(!drag)return;rotation=drag.rot+(e.clientX-drag.x)*.003;for(const a of actors.values())a.group.rotation.y=rotation+a.x*.008});canvas.addEventListener("pointerup",()=>drag=null);canvas.addEventListener("pointercancel",()=>drag=null);
if(init())sync();
</script>
